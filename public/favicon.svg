<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce289"/>
      <stop offset="50%" stop-color="#e5b85a"/>
      <stop offset="100%" stop-color="#c49335"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Iconic RPK LMIS Monogram & Scales of Justice -->
  <g transform="translate(0, 8)" filter="url(#subtleGlow)">
    <!-- Scales Crossbeam -->
    <path d="M 120 180 C 180 148, 332 148, 392 180 C 398 184, 388 194, 380 190 C 324 162, 188 162, 132 190 C 124 194, 114 184, 120 180 Z" fill="url(#goldGrad)"/>

    <!-- Left Scale Pan -->
    <path d="M 128 182 L 96 260 L 160 260 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 84 260 Q 128 300 172 260 Z" fill="url(#accentBlue)" fill-opacity="0.2" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Right Scale Pan -->
    <path d="M 384 182 L 352 260 L 416 260 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 340 260 Q 384 300 428 260 Z" fill="url(#accentBlue)" fill-opacity="0.2" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Central Monogram 'R' Structure -->
    <path d="M 210 130 H 290 C 335 130 360 160 360 195 C 360 230 335 255 290 255 H 248 V 370" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 248 250 C 275 250, 310 290, 345 370" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

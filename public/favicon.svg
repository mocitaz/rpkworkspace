<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D58E"/>
      <stop offset="50%" stop-color="#D8A84E"/>
      <stop offset="100%" stop-color="#B88628"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Solid Obsidian Dark Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#08090C"/>

  <!-- Pure Geometric Monogram Icon (No Text) -->
  <g transform="translate(136, 116)">
    <!-- Outer R Top Bar & Loop -->
    <path d="M 0 0 H 130 C 185 0 220 35 220 85 C 220 135 185 170 130 170 H 80" 
          fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- Inner R Loop -->
    <path d="M 0 34 H 124 C 158 34 184 56 184 85 C 184 114 158 136 124 136 H 80" 
          fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- Right Leg of R -->
    <path d="M 95 155 L 195 280" 
          fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="square"/>
    <path d="M 130 160 L 205 255" 
          fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="square"/>

    <!-- Left Pillar 1 (Gold) -->
    <path d="M 0 70 V 280" 
          fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="square"/>
    <path d="M -12 70 H 12 M -12 280 H 12" 
          stroke="url(#gold)" stroke-width="16" stroke-linecap="square"/>

    <!-- Center Pillar 2 (Gold) -->
    <path d="M 44 70 V 280" 
          fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="square"/>

    <!-- Inner Accent Pillar 3 (Cyan Glow) -->
    <path d="M 78 70 V 280" 
          fill="none" stroke="url(#cyanAccent)" stroke-width="18" stroke-linecap="square"/>
    <path d="M 68 70 H 88 M 68 280 H 88" 
          stroke="url(#cyanAccent)" stroke-width="12" stroke-linecap="square"/>
  </g>
</svg>

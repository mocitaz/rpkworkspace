<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_15_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f1f5f9" />
            <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>
        <linearGradient id="av_15_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f4c3a8" />
            <stop offset="100%" stop-color="#da9777" />
        </linearGradient>
        <linearGradient id="av_15_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f4c3a8" />
            <stop offset="100%" stop-color="#da9777" />
        </linearGradient>
        <clipPath id="av_15_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_15_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_15_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_15_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#da9777" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#1e293b" />
            <!-- White Collars popping out -->
            <polygon points="85,124 96,134 80,130" fill="#ffffff" />
            <polygon points="115,124 104,134 120,130" fill="#ffffff" />
            <rect x="84" y="125" width="32" height="8" rx="4" fill="#0f172a" opacity="0.6" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_15_skin)" />
        <circle cx="64" cy="90" r="4" fill="#da9777" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_15_skin)" />
        <circle cx="136" cy="90" r="4" fill="#da9777" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_15_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#da9777" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 56 75 C 55 40 76 34 100 34 C 125 34 144 42 144 75 C 138 58 118 52 102 55 C 88 58 70 54 56 75 Z" fill="#1c1917" />
            <path d="M 72 40 Q 100 36 122 42" stroke="#292524" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
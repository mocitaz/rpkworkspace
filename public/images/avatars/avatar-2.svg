<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d1fae5" />
            <stop offset="100%" stop-color="#a7f3d0" />
        </linearGradient>
        <linearGradient id="av_2_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fcd3be" />
            <stop offset="100%" stop-color="#e8af95" />
        </linearGradient>
        <linearGradient id="av_2_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd3be" />
            <stop offset="100%" stop-color="#e8af95" />
        </linearGradient>
        <clipPath id="av_2_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_2_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_2_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_2_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#e8af95" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#f1f5f9" />
            <polygon points="86,125 114,125 100,145" fill="#10b981" />
            <!-- Collars -->
            <polygon points="84,125 96,140 76,134" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
            <polygon points="116,125 104,140 124,134" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_2_skin)" />
        <circle cx="64" cy="90" r="4" fill="#e8af95" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_2_skin)" />
        <circle cx="136" cy="90" r="4" fill="#e8af95" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_2_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#382519" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#382519" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#e8af95" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        
                <!-- Blue / Square Glasses -->
                <rect x="70" y="80" width="24" height="18" rx="4" fill="none" stroke="#0ea5e9" stroke-width="3" />
                <rect x="106" y="80" width="24" height="18" rx="4" fill="none" stroke="#0ea5e9" stroke-width="3" />
                <line x1="94" y1="88" x2="106" y2="88" stroke="#0ea5e9" stroke-width="3" />
                <line x1="62" y1="86" x2="70" y2="86" stroke="#0ea5e9" stroke-width="2.5" />
                <line x1="130" y1="86" x2="138" y2="86" stroke="#0ea5e9" stroke-width="2.5" />
                <!-- Glass Glare -->
                <line x1="74" y1="84" x2="82" y2="94" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
                <line x1="110" y1="84" x2="118" y2="94" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
            

        <!-- Front Hair -->
        
            <path d="M 56 75 C 55 42 78 35 100 35 C 125 35 145 42 144 75 C 138 60 120 54 105 58 C 90 62 70 56 56 75 Z" fill="#382519" />
            <path d="M 70 40 Q 95 36 120 42" stroke="#523725" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5" />
            <path d="M 58 75 C 56 68 62 60 68 58" stroke="#382519" stroke-width="6" stroke-linecap="round" fill="none" />
            <path d="M 142 75 C 144 68 138 60 132 58" stroke="#382519" stroke-width="6" stroke-linecap="round" fill="none" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
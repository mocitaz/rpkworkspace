<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_12_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ccfbf1" />
            <stop offset="100%" stop-color="#99f6e4" />
        </linearGradient>
        <linearGradient id="av_12_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fcd7c2" />
            <stop offset="100%" stop-color="#e4af96" />
        </linearGradient>
        <linearGradient id="av_12_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd7c2" />
            <stop offset="100%" stop-color="#e4af96" />
        </linearGradient>
        <clipPath id="av_12_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_12_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_12_bg)" />
        
        <!-- Back Hair -->
        
            <circle cx="100" cy="30" r="16" fill="#451a03" />
            <circle cx="100" cy="28" r="14" fill="#78350f" opacity="0.3" />
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_12_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#e4af96" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
            <polygon points="86,125 114,125 100,152" fill="#0d9488" />
            <!-- Stethoscope -->
            <path d="M 76 130 Q 75 155 92 155" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M 124 130 Q 125 155 108 155" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <circle cx="100" cy="155" r="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_12_skin)" />
        <circle cx="64" cy="90" r="4" fill="#e4af96" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_12_skin)" />
        <circle cx="136" cy="90" r="4" fill="#e4af96" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_12_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#e4af96" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 92 106 Q 100 112 108 106" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 58 75 C 58 45 78 40 100 40 C 122 40 142 45 142 75 C 132 62 118 56 100 56 C 82 56 68 62 58 75 Z" fill="#451a03" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
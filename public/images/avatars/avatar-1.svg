<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e8ecf8" />
            <stop offset="100%" stop-color="#d0d8ee" />
        </linearGradient>
        <linearGradient id="av_1_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f5cbb1" />
            <stop offset="100%" stop-color="#e2ab8e" />
        </linearGradient>
        <linearGradient id="av_1_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5cbb1" />
            <stop offset="100%" stop-color="#e2ab8e" />
        </linearGradient>
        <clipPath id="av_1_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_1_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_1_bg)" />
        
        <!-- Back Hair -->
        
            <path d="M 60 70 Q 40 100 48 135 Q 60 145 75 140 Q 55 105 70 70 Z" fill="#543324" />
            <path d="M 140 70 Q 160 100 152 135 Q 140 145 125 140 Q 145 105 130 70 Z" fill="#543324" />
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_1_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#e2ab8e" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <!-- Shoulders & Suit -->
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#2b2f38" />
            <!-- White Shirt V -->
            <polygon points="85,125 115,125 100,152" fill="#ffffff" />
            <!-- Lapels -->
            <path d="M 75 125 L 88 155 L 70 160 Z" fill="#20232a" />
            <path d="M 125 125 L 112 155 L 130 160 Z" fill="#20232a" />
            <!-- Bow Tie -->
            <path d="M 92 130 L 108 138 L 108 130 L 92 138 Z" fill="#1e2025" />
            <circle cx="100" cy="134" r="3" fill="#1e2025" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_1_skin)" />
        <circle cx="64" cy="90" r="4" fill="#e2ab8e" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_1_skin)" />
        <circle cx="136" cy="90" r="4" fill="#e2ab8e" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_1_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#543324" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#543324" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#e2ab8e" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 55 75 Q 60 40 100 38 Q 140 40 145 75 Q 130 60 100 62 Q 70 60 55 75 Z" fill="#543324" />
            <path d="M 75 42 Q 100 40 125 45 Q 115 40 85 39 Z" fill="#734733" opacity="0.6" />
            <path d="M 55 75 Q 70 62 85 75 Q 75 62 55 75 Z" fill="#734733" opacity="0.4" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
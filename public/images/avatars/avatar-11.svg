<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_11_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#cffafe" />
            <stop offset="100%" stop-color="#a5f3fc" />
        </linearGradient>
        <linearGradient id="av_11_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f3be9b" />
            <stop offset="100%" stop-color="#d6976f" />
        </linearGradient>
        <linearGradient id="av_11_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3be9b" />
            <stop offset="100%" stop-color="#d6976f" />
        </linearGradient>
        <clipPath id="av_11_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_11_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_11_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_11_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#d6976f" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#1f2937" />
            <path d="M 75 125 Q 100 145 125 125 Q 100 135 75 125 Z" fill="#374151" />
            <circle cx="86" cy="142" r="2" fill="#06b6d4" />
            <circle cx="114" cy="142" r="2" fill="#06b6d4" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_11_skin)" />
        <circle cx="64" cy="90" r="4" fill="#d6976f" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_11_skin)" />
        <circle cx="136" cy="90" r="4" fill="#d6976f" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_11_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#111827" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#111827" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#d6976f" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 58 75 L 65 48 L 78 54 L 88 40 L 100 48 L 112 38 L 122 52 L 135 46 L 142 75 C 130 62 115 58 100 58 C 85 58 70 62 58 75 Z" fill="#111827" />
        

        <!-- Headwear if any -->
        
            <!-- Headphones Headband -->
            <path d="M 58 75 C 58 35 142 35 142 75" stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" />
            <!-- Ear Cushions -->
            <rect x="48" y="68" width="14" height="26" rx="7" fill="#06b6d4" stroke="#1f2937" stroke-width="2" />
            <rect x="138" y="68" width="14" height="26" rx="7" fill="#06b6d4" stroke="#1f2937" stroke-width="2" />
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_14_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3e8ff" />
            <stop offset="100%" stop-color="#e9d5ff" />
        </linearGradient>
        <linearGradient id="av_14_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f9cdb5" />
            <stop offset="100%" stop-color="#dda083" />
        </linearGradient>
        <linearGradient id="av_14_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f9cdb5" />
            <stop offset="100%" stop-color="#dda083" />
        </linearGradient>
        <clipPath id="av_14_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_14_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_14_bg)" />
        
        <!-- Back Hair -->
        
            <path d="M 56 75 Q 46 105 52 138 Q 66 142 76 130 Q 64 105 68 75 Z" fill="#3f2212" />
            <path d="M 144 75 Q 154 105 148 138 Q 134 142 124 130 Q 136 105 132 75 Z" fill="#3f2212" />
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_14_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#dda083" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#6b21a8" />
            <polygon points="86,125 114,125 100,148" fill="#faf5ff" />
            <!-- Buttons -->
            <circle cx="100" cy="152" r="1.5" fill="#f3e8ff" />
            <circle cx="100" cy="158" r="1.5" fill="#f3e8ff" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_14_skin)" />
        <circle cx="64" cy="90" r="4" fill="#dda083" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_14_skin)" />
        <circle cx="136" cy="90" r="4" fill="#dda083" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_14_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#3f2212" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#3f2212" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#dda083" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        
                <path d="M 68 82 Q 82 80 93 88 Q 82 98 70 93 Z" fill="none" stroke="#7e22ce" stroke-width="2.5" />
                <path d="M 132 82 Q 118 80 107 88 Q 118 98 130 93 Z" fill="none" stroke="#7e22ce" stroke-width="2.5" />
                <line x1="93" y1="87" x2="107" y2="87" stroke="#7e22ce" stroke-width="2.5" />
            

        <!-- Front Hair -->
        
            <path d="M 56 75 C 56 42 78 36 100 36 C 122 36 144 42 144 75 C 132 60 118 55 100 55 C 82 55 68 60 56 75 Z" fill="#3f2212" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
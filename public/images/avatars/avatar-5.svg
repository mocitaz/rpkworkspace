<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef3c7" />
            <stop offset="100%" stop-color="#fde68a" />
        </linearGradient>
        <linearGradient id="av_5_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#b37651" />
            <stop offset="100%" stop-color="#965a36" />
        </linearGradient>
        <linearGradient id="av_5_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b37651" />
            <stop offset="100%" stop-color="#965a36" />
        </linearGradient>
        <clipPath id="av_5_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_5_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_5_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_5_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#965a36" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#ea580c" />
            <!-- Reflective Stripes -->
            <rect x="68" y="130" width="8" height="30" fill="#f8fafc" />
            <rect x="124" y="130" width="8" height="30" fill="#f8fafc" />
            <polygon points="88,125 112,125 100,142" fill="#ffffff" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_5_skin)" />
        <circle cx="64" cy="90" r="4" fill="#965a36" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_5_skin)" />
        <circle cx="136" cy="90" r="4" fill="#965a36" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_5_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#181412" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#181412" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#965a36" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 116 110 106 Z" fill="#ffffff" stroke="#991b1b" stroke-width="1.5" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 60 72 C 60 48 80 40 100 40 C 120 40 140 48 140 72 C 130 60 118 55 100 55 C 82 55 70 60 60 72 Z" fill="#181412" />
            <!-- Mustache -->
            <path d="M 88 108 Q 95 105 100 108 Q 105 105 112 108 Q 108 114 100 112 Q 92 114 88 108 Z" fill="#181412" />
        

        <!-- Headwear if any -->
        
            <!-- Yellow Hardhat -->
            <path d="M 62 64 C 62 38 80 30 100 30 C 120 30 138 38 138 64 Z" fill="#eab308" />
            <!-- Hardhat Top Ridge -->
            <rect x="94" y="26" width="12" height="38" rx="4" fill="#ca8a04" />
            <!-- Hardhat Brim -->
            <path d="M 50 64 Q 100 56 150 64 Q 155 70 145 71 Q 100 62 55 71 Q 45 70 50 64 Z" fill="#facc15" />
            <!-- Hardhat Light Highlight -->
            <path d="M 72 40 Q 90 35 94 36" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" />
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_7_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fce7f3" />
            <stop offset="100%" stop-color="#fbcfe8" />
        </linearGradient>
        <linearGradient id="av_7_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fad4c0" />
            <stop offset="100%" stop-color="#e2ad94" />
        </linearGradient>
        <linearGradient id="av_7_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fad4c0" />
            <stop offset="100%" stop-color="#e2ad94" />
        </linearGradient>
        <clipPath id="av_7_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_7_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_7_bg)" />
        
        <!-- Back Hair -->
        
            <path d="M 130 65 Q 165 60 160 110 Q 150 125 142 105 Q 148 75 125 70 Z" fill="#1c1917" />
            <!-- Gold Hair Tie -->
            <ellipse cx="138" cy="68" rx="5" ry="7" fill="#fbbf24" transform="rotate(-15 138 68)" />
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_7_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#e2ad94" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#9f1239" />
            <polygon points="86,125 114,125 100,150" fill="#fef2f2" />
            <!-- Pearl Earrings -->
            <circle cx="62" cy="94" r="3" fill="#fef08a" stroke="#d97706" stroke-width="0.5" />
            <circle cx="138" cy="94" r="3" fill="#fef08a" stroke="#d97706" stroke-width="0.5" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_7_skin)" />
        <circle cx="64" cy="90" r="4" fill="#e2ad94" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_7_skin)" />
        <circle cx="136" cy="90" r="4" fill="#e2ad94" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_7_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#e2ad94" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 58 74 C 60 44 80 38 100 38 C 124 38 142 45 142 74 C 130 60 115 56 100 56 C 85 56 70 60 58 74 Z" fill="#1c1917" />
            <path d="M 70 42 Q 100 39 125 45" stroke="#44403c" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
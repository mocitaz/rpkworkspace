<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe4e6" />
            <stop offset="100%" stop-color="#fecdd3" />
        </linearGradient>
        <linearGradient id="av_3_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fbc9af" />
            <stop offset="100%" stop-color="#e4a78a" />
        </linearGradient>
        <linearGradient id="av_3_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbc9af" />
            <stop offset="100%" stop-color="#e4a78a" />
        </linearGradient>
        <clipPath id="av_3_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_3_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_3_bg)" />
        
        <!-- Back Hair -->
        <path d="M 65 80 Q 50 115 65 130 Q 75 132 80 120 Q 65 105 75 80 Z" fill="#1f1f23" />
                    <path d="M 135 80 Q 150 115 135 130 Q 125 132 120 120 Q 135 105 125 80 Z" fill="#1f1f23" />

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_3_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#e4a78a" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#0284c7" />
            <!-- Overalls / Straps -->
            <path d="M 52 140 L 70 160 L 58 160 Z" fill="#e11d48" />
            <path d="M 148 140 L 130 160 L 142 160 Z" fill="#e11d48" />
            <rect x="70" y="145" width="60" height="15" fill="#e11d48" rx="4" />
            <!-- Collar -->
            <polygon points="86,125 100,138 114,125" fill="#ffffff" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_3_skin)" />
        <circle cx="64" cy="90" r="4" fill="#e4a78a" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_3_skin)" />
        <circle cx="136" cy="90" r="4" fill="#e4a78a" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_3_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#1f1f23" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#1f1f23" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#e4a78a" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        <path d="M 60 70 Q 80 50 100 52 Q 120 50 140 70 Q 125 60 100 62 Q 75 60 60 70 Z" fill="#1f1f23" />

        <!-- Headwear if any -->
        
            <!-- Red Sport Visor -->
            <path d="M 60 62 Q 100 48 140 62 L 146 66 Q 100 52 54 66 Z" fill="#ef4444" />
            <path d="M 52 64 Q 100 46 148 64 Q 165 72 152 76 Q 100 58 48 76 Q 35 72 52 64 Z" fill="#dc2626" />
            <path d="M 65 60 Q 100 50 135 60" stroke="#fca5a5" stroke-width="2" fill="none" />
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
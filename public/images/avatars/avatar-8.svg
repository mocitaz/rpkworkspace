<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_8_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb" />
            <stop offset="100%" stop-color="#fef08a" />
        </linearGradient>
        <linearGradient id="av_8_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f5c6ad" />
            <stop offset="100%" stop-color="#db9e80" />
        </linearGradient>
        <linearGradient id="av_8_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5c6ad" />
            <stop offset="100%" stop-color="#db9e80" />
        </linearGradient>
        <clipPath id="av_8_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_8_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_8_bg)" />
        
        <!-- Back Hair -->
        
            <circle cx="58" cy="70" r="14" fill="#78350f" />
            <circle cx="54" cy="90" r="13" fill="#78350f" />
            <circle cx="142" cy="70" r="14" fill="#78350f" />
            <circle cx="146" cy="90" r="13" fill="#78350f" />
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_8_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#db9e80" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#d97706" />
            <rect x="80" y="118" width="40" height="15" rx="6" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_8_skin)" />
        <circle cx="64" cy="90" r="4" fill="#db9e80" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_8_skin)" />
        <circle cx="136" cy="90" r="4" fill="#db9e80" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_8_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#db9e80" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 90 106 Q 100 118 110 106 Z" fill="#991b1b" />
            <path d="M 93 106 Q 100 109 107 106" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        
                <circle cx="82" cy="89" r="11" fill="none" stroke="#d97706" stroke-width="2.5" />
                <circle cx="118" cy="89" r="11" fill="none" stroke="#d97706" stroke-width="2.5" />
                <line x1="93" y1="89" x2="107" y2="89" stroke="#d97706" stroke-width="2.5" />
                <line x1="62" y1="88" x2="71" y2="88" stroke="#d97706" stroke-width="2" />
                <line x1="129" y1="88" x2="138" y2="88" stroke="#d97706" stroke-width="2" />
            

        <!-- Front Hair -->
        
            <circle cx="70" cy="50" r="15" fill="#78350f" />
            <circle cx="90" cy="42" r="16" fill="#78350f" />
            <circle cx="110" cy="42" r="16" fill="#78350f" />
            <circle cx="130" cy="50" r="15" fill="#78350f" />
            <circle cx="100" cy="40" r="16" fill="#92400e" opacity="0.4" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
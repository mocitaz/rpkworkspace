<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_6_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e0f2fe" />
            <stop offset="100%" stop-color="#bae6fd" />
        </linearGradient>
        <linearGradient id="av_6_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8c8ad" />
            <stop offset="100%" stop-color="#de9f80" />
        </linearGradient>
        <linearGradient id="av_6_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8c8ad" />
            <stop offset="100%" stop-color="#de9f80" />
        </linearGradient>
        <clipPath id="av_6_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_6_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_6_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_6_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#de9f80" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#1e3a8a" />
            <polygon points="86,125 114,125 100,156" fill="#ffffff" />
            <!-- Golden Lapel Pin -->
            <circle cx="68" cy="142" r="2.5" fill="#f59e0b" />
            <!-- Tie -->
            <polygon points="97,132 103,132 105,158 100,160 95,158" fill="#f59e0b" />
            <!-- Lapels -->
            <path d="M 72 125 L 86 156 L 68 160 Z" fill="#172554" />
            <path d="M 128 125 L 114 156 L 132 160 Z" fill="#172554" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_6_skin)" />
        <circle cx="64" cy="90" r="4" fill="#de9f80" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_6_skin)" />
        <circle cx="136" cy="90" r="4" fill="#de9f80" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_6_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#de9f80" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 92 106 Q 100 112 108 106" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 58 74 C 58 42 78 36 100 36 C 122 36 142 42 142 74 C 135 62 120 56 100 56 C 80 56 65 62 58 74 Z" fill="#64748b" />
            <path d="M 75 42 Q 100 38 125 42" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
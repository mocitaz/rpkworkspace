<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_10_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0fdf4" />
            <stop offset="100%" stop-color="#dcfce7" />
        </linearGradient>
        <linearGradient id="av_10_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f6c5b0" />
            <stop offset="100%" stop-color="#da9c84" />
        </linearGradient>
        <linearGradient id="av_10_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f6c5b0" />
            <stop offset="100%" stop-color="#da9c84" />
        </linearGradient>
        <clipPath id="av_10_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_10_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_10_bg)" />
        
        <!-- Back Hair -->
        
            <path d="M 52 75 Q 46 110 60 125 Q 70 120 72 105 Q 60 90 62 75 Z" fill="#1e1b4b" />
            <path d="M 148 75 Q 154 110 140 125 Q 130 120 128 105 Q 140 90 138 75 Z" fill="#1e1b4b" />
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_10_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#da9c84" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#065f46" />
            <polygon points="84,125 116,125 100,144" fill="#f6c5b0" />
            <!-- Gold V-Neck Collar Trim -->
            <path d="M 82 125 L 100 145 L 118 125" stroke="#fcd34d" stroke-width="2" fill="none" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_10_skin)" />
        <circle cx="64" cy="90" r="4" fill="#da9c84" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_10_skin)" />
        <circle cx="136" cy="90" r="4" fill="#da9c84" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_10_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#da9c84" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 92 106 Q 100 112 108 106" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 55 75 C 55 40 78 35 100 35 C 122 35 145 40 145 75 C 135 60 120 54 100 54 C 80 54 65 60 55 75 Z" fill="#1e1b4b" />
            <path d="M 75 42 Q 100 39 125 42" stroke="#312e81" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
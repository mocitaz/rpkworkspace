<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e0e7ff" />
            <stop offset="100%" stop-color="#c7d2fe" />
        </linearGradient>
        <linearGradient id="av_4_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fcd0ba" />
            <stop offset="100%" stop-color="#e6a88e" />
        </linearGradient>
        <linearGradient id="av_4_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd0ba" />
            <stop offset="100%" stop-color="#e6a88e" />
        </linearGradient>
        <clipPath id="av_4_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_4_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_4_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_4_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#e6a88e" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#e2e8f0" />
            <!-- Shoulder Armor Pads -->
            <rect x="52" y="132" width="22" height="18" rx="4" fill="#4f46e5" />
            <rect x="126" y="132" width="22" height="18" rx="4" fill="#4f46e5" />
            <!-- Chest Panel -->
            <rect x="82" y="138" width="36" height="20" rx="4" fill="#1e293b" />
            <rect x="86" y="142" width="12" height="5" rx="1" fill="#38bdf8" />
            <rect x="102" y="142" width="12" height="5" rx="1" fill="#f43f5e" />
            <circle cx="92" cy="152" r="2.5" fill="#facc15" />
            <circle cx="108" cy="152" r="2.5" fill="#4ade80" />
        

        <!-- Ears -->
        <circle cx="64" cy="90" r="8" fill="url(#av_4_skin)" />
        <circle cx="64" cy="90" r="4" fill="#e6a88e" opacity="0.4" />
        <circle cx="136" cy="90" r="8" fill="url(#av_4_skin)" />
        <circle cx="136" cy="90" r="4" fill="#e6a88e" opacity="0.4" />

        <!-- Face Shape (Smooth 3D Oval) -->
        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_4_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />
        <ellipse cx="124" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

        <!-- Eyebrows -->
        <path d="M 74 74 Q 83 70 90 74" stroke="#2c2d30" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 110 74 Q 117 70 126 74" stroke="#2c2d30" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#e6a88e" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 92 106 Q 100 112 108 106" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 60 70 C 60 45 80 38 100 38 C 120 38 140 45 140 70 C 132 58 118 54 100 54 C 82 54 68 58 60 70 Z" fill="#2c2d30" />
        

        <!-- Headwear if any -->
        
            <!-- Outer Astronaut Helmet -->
            <rect x="52" y="38" width="96" height="90" rx="36" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
            <!-- Side Ear Nodes -->
            <rect x="44" y="70" width="12" height="24" rx="4" fill="#6366f1" />
            <rect x="144" y="70" width="12" height="24" rx="4" fill="#6366f1" />
            <!-- Visor Dark Window Border -->
            <rect x="62" y="52" width="76" height="66" rx="20" fill="none" stroke="#64748b" stroke-width="3" />
            <!-- Visor Glass Tint Glare -->
            <path d="M 68 58 Q 100 54 132 58" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
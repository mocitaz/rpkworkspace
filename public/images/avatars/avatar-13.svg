        <path d="M 110 74 Q 117 70 126 74" stroke="#262626" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Eyes -->
        <ellipse cx="82" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="80.5" cy="86" r="1.8" fill="#ffffff" />
        <ellipse cx="118" cy="88" rx="4.5" ry="5.5" fill="#18181b" />
        <circle cx="116.5" cy="86" r="1.8" fill="#ffffff" />

        <!-- 3D Nose -->
        <path d="M 98 88 Q 100 96 103 96 Q 100 98 97 96" fill="#c47d53" opacity="0.7" />

        <!-- Mouth -->
        
            <path d="M 92 106 Q 100 112 108 106" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
        

        <!-- Glasses if any -->
        

        <!-- Front Hair -->
        
            <path d="M 58 72 C 58 45 78 38 100 38 C 122 38 142 45 142 72 C 132 60 118 55 100 55 C 82 55 68 60 58 72 Z" fill="#262626" />
            <!-- Neat Beard & Mustache -->

            <path d="M 88 106 Q 95 103 100 106 Q 105 103 112 106 Q 108 112 100 110 Q 92 112 88 106 Z" fill="#262626" />
        

        <!-- Headwear if any -->
        
    </g>

    <!-- Subtle Outer Border -->
    <circle cx="100" cy="100" r="97" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />

        <ellipse cx="100" cy="88" rx="36" ry="40" fill="url(#av_13_skin)" />
        
        <!-- Subtle Cheeks Blush -->
        <ellipse cx="76" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.2" />

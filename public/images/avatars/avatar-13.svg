<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="av_13_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffedd5" />
            <stop offset="100%" stop-color="#fed7aa" />
        </linearGradient>
        <linearGradient id="av_13_skin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e2a37c" />
            <stop offset="100%" stop-color="#c47d53" />
        </linearGradient>
        <linearGradient id="av_13_nose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2a37c" />
            <stop offset="100%" stop-color="#c47d53" />
        </linearGradient>
        <clipPath id="av_13_clip">
            <circle cx="100" cy="100" r="96" />
        </clipPath>
    </defs>

    <!-- Circular Avatar Background -->
    <g clip-path="url(#av_13_clip)">
        <circle cx="100" cy="100" r="98" fill="url(#av_13_bg)" />
        
        <!-- Back Hair -->
        

        <!-- Neck -->
        <rect x="88" y="105" width="24" height="30" rx="8" fill="url(#av_13_skin)" />
        <!-- Neck Shadow -->
        <path d="M 88 115 Q 100 122 112 115 L 112 125 L 88 125 Z" fill="#c47d53" opacity="0.4" />

        <!-- Outfit & Shoulders -->
        
            <path d="M 40 160 C 40 135 65 125 100 125 C 135 125 160 135 160 160 Z" fill="#a16207" />
            <polygon points="86,125 114,125 100,150" fill="#ffffff" />
            <path d="M 74 125 L 88 152 L 70 160 Z" fill="#854d0e" />
            <path d="M 126 125 L 112 152 L 130 160 Z" fill="#854d0e" />
        


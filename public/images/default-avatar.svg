<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="120" height="120" fill="url(#bg)"/>

  <!-- Head -->
  <circle cx="60" cy="45" r="20" fill="url(#silhouette)"/>

  <!-- Torso & Shoulders touching bottom cleanly -->
  <path d="M 22 120 C 22 88 39 77 60 77 C 81 77 98 88 98 120 Z" fill="url(#silhouette)"/>
</svg>
